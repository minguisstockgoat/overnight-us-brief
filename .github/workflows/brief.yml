name: Overnight US Market Brief

# 평일 07:10 KST(= 22:10 UTC 일~목) 자동 실행 → data.json 갱신 → Pages 반영.
#
# 아카이브(macmini.taila0cca3.ts.net)는 Tailscale tailnet 전용 주소라 클라우드에서 바로 못 닿음.
# → Actions가 tailnet에 조인해야 함. 인증은 Tailscale OAuth 클라이언트(만료 없음)를 쓴다:
#   1) 접근 제어(ACL)의 tagOwners 에 "tag:ci" 추가
#   2) https://login.tailscale.com/admin/settings/oauth → Generate OAuth client
#      (Keys > Auth Keys: Write, 태그 tag:ci)
#   3) 시크릿 TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET 등록
# 예전 인증키(TS_AUTHKEY)는 최대 90일이면 만료돼 2026-10-20부터 매일 실패했음.
# OAuth 시크릿이 없으면 TS_AUTHKEY 로, 둘 다 없으면 '실패 없이' 스킵(경고만).
on:
  schedule:
    # GitHub 예약 크론은 지연·누락이 잦아 아침에 여러 번 재시도(모두 07:00 KST 이후, 09:00 개장 전).
    # 이미 오늘 생성됐으면 pipeline이 API 안 부르고 스킵하므로 중복은 무해.
    # 분(minute)을 정각에서 비켜 혼잡을 회피. UTC 기준.
    - cron: "13 22 * * 0-4"   # 07:13 KST
    - cron: "38 22 * * 0-4"   # 07:38 KST
    - cron: "8 23 * * 0-4"    # 08:08 KST (백업)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 연휴 창(2026-09-28, 107h·134청크)은 동시 6에서 22분 걸렸음. 긴 창도 여유 있게 끝나도록 넉넉히.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Gate on Tailscale credentials
        id: gate
        env:
          OAUTH_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -n "$OAUTH_ID" ] && [ -n "$OAUTH_SECRET" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "auth=oauth" >> "$GITHUB_OUTPUT"
          elif [ -n "$TS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "auth=key" >> "$GITHUB_OUTPUT"
            echo "::warning::TS_AUTHKEY 로 접속합니다(최대 90일 만료). TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET 등록을 권장."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tailscale 자격증명 시크릿이 없어 클라우드 실행을 건너뜁니다."
          fi

      - name: Connect to Tailscale (OAuth)
        if: steps.gate.outputs.auth == 'oauth'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Connect to Tailscale (auth key)
        if: steps.gate.outputs.auth == 'key'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Run pipeline
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 45
        env:
          ARCHIVE_URL: https://macmini.taila0cca3.ts.net/
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_CONCURRENCY: "12"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPUS_MODEL: claude-opus-4-8
        # -u: 출력 버퍼링 끔 → 진행 로그가 실행 중에도 Actions 화면에 바로 보임
        run: python -u scripts/pipeline.py --out data.json

      - name: Commit & push if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "brief: $(date -u +%F)"
          git push
