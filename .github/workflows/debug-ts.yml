name: Debug Tailscale
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Diagnose
        run: |
          set +e
          echo "== ip addr =="; ip -brief addr
          echo "== curl -4 =="; timeout 20 curl -4 -s -o /dev/null -w "%{http_code} connect=%{time_connect}\n" --max-time 15 https://macmini.taila0cca3.ts.net/
          echo "== curl -6 =="; timeout 20 curl -6 -s -o /dev/null -w "%{http_code} connect=%{time_connect}\n" --max-time 15 https://macmini.taila0cca3.ts.net/
          echo "== python =="
          python - <<'PY'
          import socket, time, httpx
          print("getaddrinfo:", socket.getaddrinfo("macmini.taila0cca3.ts.net", 443, type=socket.SOCK_STREAM))
          for fam,label in ((socket.AF_INET,"v4"),(socket.AF_INET6,"v6")):
              try:
                  ai = socket.getaddrinfo("macmini.taila0cca3.ts.net", 443, fam, socket.SOCK_STREAM)[0]
                  t=time.time(); s=socket.socket(fam, socket.SOCK_STREAM); s.settimeout(8)
                  s.connect(ai[4]); print(label,"connect OK", round(time.time()-t,2)); s.close()
              except Exception as e:
                  print(label,"FAIL", type(e).__name__, e)
          t=time.time()
          try:
              r = httpx.get("https://macmini.taila0cca3.ts.net/", timeout=httpx.Timeout(30, connect=10.0))
              print("httpx", r.status_code, round(time.time()-t,2))
          except Exception as e:
              print("httpx FAIL", type(e).__name__, e, round(time.time()-t,2))
          PY
          echo done
